name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tooling directories and user
        run: |
          mkdir -p .cache/bun
          echo "BUN_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "BUN_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: docker compose build bun
      - run: docker compose run --rm bun install --frozen-lockfile
      - run: docker compose run --rm bun run verify
